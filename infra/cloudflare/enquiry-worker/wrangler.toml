# Two Workers from one source (ADR-002, docs/devops/cicd.md):
#   --env staging     -> enquiry-staging, deployed by deploy-worker.yml from main
#   --env production  -> enquiry, deployed by release.yml under environment: production at the release tag
# Always pass --env. The top-level name is "enquiry-local" (no rate-limit binding, not inherited), so a bare
# deploy can never overwrite a real Worker. Rate limits and secrets are per Worker
# (the HUBSPOT_* secrets are set by the owner for each Worker in the dashboard).
name = "enquiry-local"
main = "index.ts"
compatibility_date = "2026-10-27"
workers_dev = true
keep_vars = true

[observability]
enabled = false

[env.staging]
name = "enquiry-staging"

# Accept the staging site (the Pages `staging` alias of the configured domain), see index.ts allowedOrigin.
[env.staging.vars]
SITE_ENV = "staging"

[[env.staging.ratelimits]]
name = "ENQUIRY_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[env.production]
name = "enquiry"

[[env.production.ratelimits]]
name = "ENQUIRY_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
