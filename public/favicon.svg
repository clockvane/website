<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Brand mark: two tools joined through a human checkpoint. Colours mirror the
       light action (#141414), light on-action (#FFFFFF) and dark focus (#A8B8FF) tokens. -->
  <rect width="32" height="32" rx="7" fill="#141414"/>
  <path d="M7.5 16H24.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="7.5" cy="16" r="3.5" fill="#FFFFFF"/>
  <circle cx="24.5" cy="16" r="3.5" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="4" fill="#A8B8FF"/>
</svg>
