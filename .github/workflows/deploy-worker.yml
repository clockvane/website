name: deploy-worker

# Deploys the enquiry Worker (infra/cloudflare/enquiry-worker, ADR-002) when its code changes on
# main, or on demand. HUBSPOT_PORTAL_ID and HUBSPOT_FORM_GUID are Worker secrets the owner sets in
# the Cloudflare dashboard (Owner checklist); deploys never touch them.
on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/enquiry-worker/**'
      - 'infra/headers/**'
      - 'src/lib/contact/**'
      - 'src/content/contact.ts'
      - 'src/content/services.ts'
      - 'site.config.ts'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions: {}

# Never cancel a deploy in flight; a newer merge waits for it.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.153.0'

jobs:
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!n}" ] || { echo "::error::Missing $n in the 'staging' environment (Owner checklist)."; exit 1; }
          done
      - name: Deploy enquiry Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config infra/cloudflare/enquiry-worker/wrangler.toml
