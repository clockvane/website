name: rollback

# Redeploy a previous release's retained artifact (docs/devops/cicd.md, Rollback). No rebuild.
# Run it with "Use workflow from" set to a release TAG (for example the current one): the `production`
# environment only accepts v* tags, and the owner approves the run there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Previous release tag to redeploy (vX.Y.Z)'
        required: true
        type: string

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.153.0'
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag and find its retained artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }
          git fetch --tags --force origin
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          run_id="$(infra/cloudflare/find-artifact-run.sh "$sha")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Rolling back to $TAG = $sha from ci run $run_id" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: rollback-production
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev/
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      RUN_ID: ${{ needs.verify.outputs.run_id }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CF_PAGES_PRODUCTION_BRANCH: ${{ vars.CF_PAGES_PRODUCTION_BRANCH || 'main' }}
      ENQUIRY_WORKER_ORIGIN: ${{ vars.ENQUIRY_WORKER_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:${missing}. The owner must add them to the 'production' environment (docs/devops/cicd.md, Secrets)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ env.SHA }}
          path: ${{ runner.temp }}/artifact
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify artifact and add production headers
        run: infra/cloudflare/prepare-production.sh "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/production"
      - name: Redeploy to Cloudflare Pages (production branch)
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy production \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$CF_PAGES_PRODUCTION_BRANCH" \
            --commit-hash "$SHA" \
            --commit-dirty=true
      - name: Smoke test
        run: |
          health=""
          [ -z "$ENQUIRY_WORKER_ORIGIN" ] || health="${ENQUIRY_WORKER_ORIGIN%/}/health"
          infra/cloudflare/smoke-production.sh "https://${CF_PAGES_PROJECT}.pages.dev/" "$health"
