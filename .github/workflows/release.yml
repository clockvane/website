name: release

# Production release (docs/devops/release.md, ADR-002). A pushed vX.Y.Z tag builds nothing: it finds the
# artifact that ci.yml produced and staging tested for the tagged commit, waits for the owner's approval
# on the `production` environment, deploys that artifact, smoke tests it and publishes the GitHub Release.
# Pre-release tags (v1.0.0-rc.1) never match and never reach production.
on:
  push:
    tags: ['v*.*.*', '!v*-*']

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.153.0'
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      sums: ${{ steps.resolve.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and find the tested artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1; }
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          # Fails closed unless staging succeeded for this commit; returns the staged artifact's identity.
          read -r run_id sums < <(infra/cloudflare/find-artifact-run.sh "$sha")
          {
            echo "sha=$sha"
            echo "run_id=$run_id"
            echo "sums=$sums"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG = $sha from ci run $run_id (staging-verified)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-production
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits here for the owner's approval; the Cloudflare token is only released after it.
    environment:
      name: production
      url: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev/
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      RUN_ID: ${{ needs.verify.outputs.run_id }}
      SUMS: ${{ needs.verify.outputs.sums }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CF_PAGES_PRODUCTION_BRANCH: ${{ vars.CF_PAGES_PRODUCTION_BRANCH || 'main' }}
      ENQUIRY_WORKER_ORIGIN: ${{ vars.ENQUIRY_WORKER_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:${missing}. The owner must add them to the 'production' environment (docs/devops/cicd.md, Secrets)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ env.SHA }}
          path: ${{ runner.temp }}/artifact
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify artifact and add production headers
        run: infra/cloudflare/prepare-production.sh "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/production" "$SUMS"
      - name: Deploy to Cloudflare Pages (production branch)
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy production \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$CF_PAGES_PRODUCTION_BRANCH" \
            --commit-hash "$SHA" \
            --commit-dirty=true
      - name: Deploy production enquiry Worker (tag source)
        run: |
          npm ci --ignore-scripts
          npx wrangler deploy --env production --config infra/cloudflare/enquiry-worker/wrangler.toml
      - name: Smoke test
        run: |
          health=""
          [ -z "$ENQUIRY_WORKER_ORIGIN" ] || health="${ENQUIRY_WORKER_ORIGIN%/}/health"
          infra/cloudflare/smoke-production.sh "https://${CF_PAGES_PROJECT}.pages.dev/" "$health"

  github-release:
    name: github-release
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish GitHub Release from Conventional Commit titles
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          RUN_ID: ${{ needs.verify.outputs.run_id }}
          SUMS: ${{ needs.verify.outputs.sums }}
        run: |
          # The record pins the released artifact for rollback.yml (run id + checksum of SHA256SUMS).
          printf 'tag=%s\nsha=%s\nci_run_id=%s\nsums_sha256=%s\n' "$TAG" "$SHA" "$RUN_ID" "$SUMS" > "$RUNNER_TEMP/release-record.txt"
          prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | grep -vx "$TAG" | head -n 1 || true)"
          args=(--version "${TAG#v}" --to "refs/tags/$TAG")
          [ -z "$prev" ] || args+=(--from "refs/tags/$prev")
          node infra/release/changelog.ts "${args[@]}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release-record.txt"
