name: deploy-preview

# Per-PR preview deploy (ADR-002, docs/devops/cicd.md). Triggered by workflow_run, so GitHub
# runs THIS file from main, never the PR's copy: a PR cannot reach the Cloudflare token.
# The CI artifact is treated as data only (checksums verified, nothing in it is executed).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.153.0'

jobs:
  deploy-preview:
    name: deploy-preview
    # Same-repo PRs whose CI passed. Fork PRs never get here (and have no secrets).
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:${missing}. The owner must add the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the 'preview' environment and the variable CF_PAGES_PROJECT to the repository (docs/devops/cicd.md, Secrets)."
            exit 1
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad PR number"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad SHA"; exit 1; }

      # Default ref of a workflow_run job is the default branch: trusted adapter scripts only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/artifact
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify artifact and add preview-only files
        run: infra/cloudflare/prepare-preview.sh "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/preview"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Deploy to Cloudflare Pages
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy preview \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "pr-${PR_NUMBER}" \
            --commit-hash "$HEAD_SHA" \
            --commit-dirty=true

      - name: Smoke test
        run: |
          url="https://pr-${PR_NUMBER}.${CF_PAGES_PROJECT}.pages.dev/"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -D "$RUNNER_TEMP/headers.txt" -o /dev/null "$url" &&
               grep -qi '^x-robots-tag:.*noindex' "$RUNNER_TEMP/headers.txt"; then
              echo "OK: $url is up and noindex"; exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed for $url (unreachable or missing X-Robots-Tag noindex)"
          exit 1

      - name: Comment preview URL on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const url = `https://pr-${pr}.${process.env.CF_PAGES_PROJECT}.pages.dev/`;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n**Preview:** ${url}\n\nCommit \`${process.env.HEAD_SHA.slice(0, 7)}\`. Not indexed by search engines. Removed when the PR closes.`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker) && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
